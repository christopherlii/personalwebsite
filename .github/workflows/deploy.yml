# Content lives in the private christopherlii/site-content repo. This joins it
# with the code here and publishes the result, so the public history only ever
# shows code. Content goes live at the next daily run — every day deploys
# whether or not anything changed, so the run list never says when something
# was published. Avoid manual runs for content; they stand out.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christopherlii/site-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content
      - run: python3 build.py --site _site > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub disables schedules in public repos after 60 days without a
      # commit; re-enabling on every run keeps the daily deploy alive.
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
