<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#fafafa">
  <title>journal</title>
  <link rel="stylesheet" href="./journal.css">
  <script type="module" src="./journal.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>

    <h1>journal</h1>
    <form id="login-form">
      <label for="password">password</label>
      <input id="password" type="text" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" required maxlength="1024">
      <button class="solid" id="unlock" type="submit">unlock</button>
    </form>
    <p id="login-message" role="status"></p>
  </section>

  <main id="app" class="journal" hidden>
    <header class="page-header page-entrance">
      <a class="site-name" href="https://christopherli.dev/">Christopher Li</a>
      <div class="utilities">
        <button type="button" id="toggle-timeline" aria-expanded="true" aria-controls="timeline">hide timeline</button>
        <button type="button" id="journal-menu-toggle" data-menu aria-label="journal options" aria-expanded="false" aria-controls="journal-menu">more</button>
      </div>
      <nav id="journal-menu" class="entry-menu journal-menu" aria-label="journal" hidden>
        <button type="button" data-view="all" aria-current="page">all thoughts</button>
        <button type="button" data-view="saved">saved</button>
        <a href="#reading">read later</a>
        <button type="button" id="logout">lock</button>
      </nav>
    </header>
    <section id="composer-section" class="composer-section page-entrance" aria-label="write or search your thoughts">
      <form id="composer">
        <div id="composer-title">
          <label for="title" class="sr-only">title (optional)</label>
          <input id="title" class="title-input" placeholder="no title" maxlength="160" autocomplete="off">
        </div>
        <div id="composer-editor"></div>
        <ul id="command-menu" class="command-menu" role="listbox" aria-label="commands" hidden></ul>
        <textarea id="body" hidden aria-hidden="true" tabindex="-1"></textarea>
        <div class="composer-toolbar">
          <span id="command-receipt" class="command-receipt" role="status"></span>
          <div class="composer-tools">
            <button id="dictate-composer" class="dictate-toggle tool-button" type="button" aria-pressed="false" aria-describedby="dictation-composer-status" aria-label="start dictation" title="Dictate. Live dictation. Audio is processed by Cloudflare and is not saved in the journal."><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5"/></svg></button>
          </div>
          <div class="compose-actions" id="compose-actions"><button type="submit" id="save-essay" hidden disabled>save draft</button><button class="post" type="submit" id="post" aria-label="post" title="Post (⌘↵)" disabled><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg></button></div>
        </div>
        <div class="writing-feedback">
          <span id="dictation-composer-status" role="status"></span>
          <div class="draft-feedback"><span id="draft-status" role="status"></span><button type="button" id="retry-draft" hidden>retry</button></div>
        </div>
      </form>
      <aside id="float-left" class="float float-left" aria-label="your thoughts" hidden></aside>
      <aside id="float-right" class="float float-right" aria-label="further reading" hidden></aside>
    </section>
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="copy-status" class="sr-only" role="status"></p>
    <nav id="tag-filter" class="tag-filter" aria-label="tag filter" hidden><span id="active-tag"></span><a href="#">all thoughts</a></nav>
    <section id="timeline" aria-label="timeline">
      <div class="view-heading"><h1 id="view-title" class="sr-only">thoughts</h1></div>
      <div class="stream">
        <div id="feed" aria-busy="false"></div>
      </div>
      <div class="feed-footer"><p id="feed-status" role="status"></p><button type="button" id="more" hidden>load more</button></div>
    </section>
  </main>
  <main id="reader" class="reader" hidden>
    <header class="reader-toolbar">
      <div class="reader-context"><a id="reader-back" href="#" aria-label="back to timeline">back</a><span id="reader-draft-label" class="entry-tag entry-draft" hidden>draft</span></div>
      <div class="reader-actions">
        <button type="button" id="reader-post" hidden>post ↗</button>
        <button type="button" id="reader-cancel" hidden>cancel</button>
        <button type="submit" form="edit-form" id="reader-save" hidden>save</button>
        <button type="button" id="reader-bookmark" aria-pressed="false">save</button>
        <button type="button" id="reader-like" aria-pressed="false">like</button>
        <button type="button" id="reader-edit">edit</button>
        <button type="button" id="reader-menu-toggle" data-menu aria-label="thought options" aria-expanded="false" aria-controls="reader-menu">…</button>
      </div>
      <nav id="reader-menu" class="entry-menu reader-menu" aria-label="thought actions" hidden>
        <button type="button" id="reader-public">publish…</button>
        <button type="button" id="reader-delete">delete…</button>
      </nav>
    </header>
    <article id="reader-content" tabindex="-1"></article>
    <form id="edit-form" hidden>
      <label for="edit-thought-title" class="sr-only">title (optional)</label>
      <input id="edit-thought-title" class="title-input" placeholder="no title" maxlength="160" autocomplete="off">
      <div id="live-editor"></div>
      <textarea id="edit-body" hidden aria-hidden="true" tabindex="-1"></textarea>
      <div class="dictation-controls"><button type="button" id="dictate-reader" class="dictate-toggle tool-button" aria-pressed="false" aria-describedby="dictation-reader-status" aria-label="start dictation" title="Dictate. Live dictation. Audio is processed by Cloudflare and is not saved in the journal." hidden><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2.5"/></svg></button></div>
      <div class="writing-feedback"><span id="dictation-reader-status" role="status"></span></div>
    </form>
    <p id="reader-error" role="status"></p><button type="button" id="reader-retry" hidden>retry save</button>
    <section id="related" class="related-reading" aria-label="related thoughts and reading" hidden></section>
  </main>
  <main id="work" class="reader work-reader" hidden>
    <header class="reader-toolbar"><a id="work-back" href="#" aria-label="back to timeline">back</a></header>
    <article id="work-content" class="work-content" tabindex="-1"></article>
  </main>
  <main id="reading" class="reader reading-page" hidden>
    <header class="reader-toolbar"><a href="#">back</a><a class="site-name" href="https://christopherli.dev/">Christopher Li</a></header>
    <h1>read later</h1>
    <form id="reading-form">
      <label for="reading-url" class="sr-only">web address to save</label>
      <input id="reading-url" type="url" placeholder="paste a link to save…" maxlength="2048" required autocomplete="off">
      <button id="reading-save" type="submit">save link</button>
    </form>
    <p id="reading-message" class="reading-message" role="status"></p>
    <nav class="reading-filters" aria-label="reading status"><button type="button" data-reading-filter="unread" aria-current="page">to read</button><button type="button" data-reading-filter="read">read</button></nav>
    <div id="reading-list"></div>
    <p id="reading-empty" class="reading-message" role="status"></p>
    <button id="reading-more" type="button" hidden>load more</button>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <form id="delete-form">
      <h2 id="delete-title">delete this thought?</h2>
      <p id="delete-error" role="status"></p>
      <footer><button type="button" data-close="delete-dialog">keep</button><button type="submit" class="solid">delete</button></footer>
    </form>
  </dialog>
  <dialog id="public-dialog" aria-labelledby="public-title">
    <header><h2 id="public-title">public draft</h2><button type="button" data-close="public-dialog">close</button></header>
    <label for="public-thought-title" class="sr-only">public title</label>
    <input id="public-thought-title" class="title-input" placeholder="no title" maxlength="160" autocomplete="off" aria-required="true">
    <label for="public-body" class="sr-only">public draft text</label>
    <textarea id="public-body" rows="10" maxlength="20000"></textarea>
    <details class="publication-details">
      <summary>details</summary>
      <div class="publication-fields">
        <label>address<input id="public-slug" maxlength="100" autocomplete="off"></label>
        <label>date<input id="public-date" type="date"></label>
        <label class="wide">description<input id="public-description" maxlength="1000"></label>
        <label class="wide">tags<input id="public-tags" maxlength="2400"></label>
        <label class="wide">cover image<input id="public-cover" maxlength="1000"></label>
        <label>cover position<input id="public-cover-position" maxlength="100"></label>
      </div>
    </details>
    <p id="public-status" role="status"></p>
    <footer class="public-actions">
      <button type="button" id="public-menu-toggle" data-menu aria-label="public draft options" aria-expanded="false" aria-controls="public-menu">…</button>
      <a id="view-public" target="_blank" rel="noopener noreferrer" hidden>view on site ↗</a>
      <button type="button" id="save-public">save draft</button>
      <button type="button" id="publish-public">publish to site ↗</button>
      <nav id="public-menu" class="entry-menu" aria-label="public draft actions" hidden><button type="button" id="copy-public">copy text</button><button type="button" id="download-public">download markdown</button><button type="button" id="unpublish" hidden>unpublish</button></nav>
    </footer>
  </dialog>
  <p id="boot-status" class="boot" role="status"></p>
</body>
</html>
